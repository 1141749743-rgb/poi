# ============ 服务配置 ============
server.port=8080

# ============ 数据库（复用现有 campus_poi，数据一条不用重新导） ============
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/campus_poi?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:Czh112233}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============ Thymeleaf 模板 ============
# 开发阶段关掉缓存，改模板立刻生效（相当于 Flask 的 debug 热重载）
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# ============ 高德地图 Key（从环境变量读，绝不写死在代码里） ============
# 启动前设置：set AMAP_JS_KEY=xxx / set AMAP_SECURITY_CODE=xxx
# 不设置也能跑：详情页只显示经纬度和"在高德打开"的链接（URI 方式不需要 Key）
amap.js-key=${AMAP_JS_KEY:}
amap.security-code=${AMAP_SECURITY_CODE:}

# ============ 校园中心点（广东第二师范学院 花都校区 大门） ============
campus.name=\u5e7f\u4e1c\u7b2c\u4e8c\u5e08\u8303\u5b66\u9662\uff08\u82b1\u90fd\u6821\u533a\uff09
campus.address=\u5e7f\u5dde\u5e02\u82b1\u90fd\u533a\u8fce\u5bbe\u5927\u9053\u897f30\u53f7
