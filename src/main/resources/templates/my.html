<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的收藏 · 校园生活圈</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div th:replace="~{partials/nav}"></div>

<div class="wrap">
    <div th:replace="~{partials/flash}"></div>

    <div class="detail-head" style="margin:26px 0 14px;">
        <div>
            <h1 style="font-size:24px;">⭐ 我的收藏</h1>
            <p class="sub">共 [[${favList.size()}]] 个地点 · 按收藏时间倒序</p>
        </div>
        <a href="/" class="btn-app ghost sm">← 返回首页</a>
    </div>

    <div class="grid grid-3">
        <div class="card-app poi-card" th:each="poi : ${favList}">
            <div class="poi-title">
                <h3 th:text="${poi.name}"></h3>
                <span class="poi-cat" th:text="${poi.categoryName}"></span>
            </div>
            <p class="poi-addr">📍 [[${poi.address != null ? poi.address : '暂无地址'}]]</p>
            <div class="poi-meta">
                <span>★ [[${poi.avgScore}]]</span>
                <span>👁 [[${poi.visitCount}]]</span>
                <span style="color:var(--ink-3);font-size:12px;">收藏于 [[${poi.favTime}]]</span>
            </div>
            <div class="poi-tags">
                <span class="tag" th:each="tag : ${poi.tagList}" th:text="${tag}"></span>
            </div>
            <div class="poi-foot">
                <a th:href="'/poi/' + ${poi.id}" class="btn-app sm">查看详情</a>
                <form th:action="'/favorite/toggle/' + ${poi.id}" method="POST" style="margin:0;">
                    <button class="btn-app ghost sm">取消收藏</button>
                </form>
            </div>
        </div>
        <div class="empty" style="grid-column:1/-1;" th:if="${#lists.isEmpty(favList)}">
            还没有收藏任何地点。去<a href="/" style="color:var(--brand);font-weight:600;">首页</a>逛逛，看到喜欢的点一下收藏。
        </div>
    </div>

    <div style="height:50px;"></div>
</div>
</body>
</html>
