<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${mode == 'add'} ? '新增地点 - 后台管理' : '编辑地点 - 后台管理'">地点表单 - 后台管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand" th:text="${mode == 'add'} ? '➕ 新增地点' : '✏️ 编辑地点'"></span>
            <a href="/admin" class="btn btn-light btn-sm">← 返回后台列表</a>
        </div>
    </nav>

    <div class="container" style="max-width:760px;">
        <div th:replace="~{partials/flash}"></div>

        <form th:if="${mode == 'add'}" action="/admin/poi/add" method="POST">
            <div class="row g-3">
                <div class="col-md-8">
                    <label class="form-label">名称 <span class="text-danger">*</span></label>
                    <input type="text" name="name" class="form-control" required value="">
                </div>
                <div class="col-md-4">
                    <label class="form-label">分类 <span class="text-danger">*</span></label>
                    <select name="category_id" class="form-select" required>
                        <option value="">请选择</option>
                        <option th:each="cate : ${cates}" th:value="${cate.id}" th:text="${cate.name}"></option>
                    </select>
                </div>

                <div class="col-md-3">
                    <label class="form-label">经度 lng</label>
                    <input type="text" name="lng" class="form-control" placeholder="113.221" value="">
                </div>
                <div class="col-md-3">
                    <label class="form-label">纬度 lat</label>
                    <input type="text" name="lat" class="form-control" placeholder="23.331" value="">
                </div>
                <div class="col-md-6">
                    <label class="form-label">标签（英文逗号分隔）</label>
                    <input type="text" name="tags" class="form-control" placeholder="安静,便宜,早餐" value="">
                </div>

                <div class="col-md-8">
                    <label class="form-label">地址</label>
                    <input type="text" name="address" class="form-control" value="">
                </div>
                <div class="col-md-4">
                    <label class="form-label">营业时间</label>
                    <input type="text" name="business_hour" class="form-control" placeholder="08:00-22:00" value="">
                </div>

                <div class="col-12">
                    <label class="form-label">图片地址（可选，填网络图片 URL）</label>
                    <input type="text" name="cover_img" class="form-control" placeholder="https://..." value="">
                </div>

                <div class="col-12">
                    <label class="form-label">简介</label>
                    <textarea name="intro" class="form-control" rows="3"></textarea>
                </div>

                <div class="col-md-4">
                    <label class="form-label">状态</label>
                    <select name="status" class="form-select">
                        <option value="1" selected>上架</option>
                        <option value="0">下架</option>
                    </select>
                </div>

                <div class="col-12 mt-4">
                    <button class="btn btn-primary">保存并添加到列表</button>
                    <a href="/admin" class="btn btn-outline-secondary">取消</a>
                </div>
            </div>
        </form>

        <form th:if="${mode == 'edit'}" th:action="'/admin/poi/edit/' + ${poi.id}" method="POST">
            <div class="row g-3">
                <div class="col-md-8">
                    <label class="form-label">名称 <span class="text-danger">*</span></label>
                    <input type="text" name="name" class="form-control" required th:value="${poi.name}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">分类 <span class="text-danger">*</span></label>
                    <select name="category_id" class="form-select" required>
                        <option value="">请选择</option>
                        <option th:each="cate : ${cates}" th:value="${cate.id}" th:text="${cate.name}"
                                th:selected="${poi.categoryId != null and poi.categoryId == cate.id}"></option>
                    </select>
                </div>

                <div class="col-md-3">
                    <label class="form-label">经度 lng</label>
                    <input type="text" name="lng" class="form-control" placeholder="113.221"
                           th:value="${poi.lng != null ? poi.lng : ''}">
                </div>
                <div class="col-md-3">
                    <label class="form-label">纬度 lat</label>
                    <input type="text" name="lat" class="form-control" placeholder="23.331"
                           th:value="${poi.lat != null ? poi.lat : ''}">
                </div>
                <div class="col-md-6">
                    <label class="form-label">标签（英文逗号分隔）</label>
                    <input type="text" name="tags" class="form-control" placeholder="安静,便宜,早餐"
                           th:value="${poi.tags != null ? poi.tags : ''}">
                </div>

                <div class="col-md-8">
                    <label class="form-label">地址</label>
                    <input type="text" name="address" class="form-control"
                           th:value="${poi.address != null ? poi.address : ''}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">营业时间</label>
                    <input type="text" name="business_hour" class="form-control" placeholder="08:00-22:00"
                           th:value="${poi.businessHour != null ? poi.businessHour : ''}">
                </div>

                <div class="col-12">
                    <label class="form-label">图片地址（可选，填网络图片 URL）</label>
                    <input type="text" name="cover_img" class="form-control" placeholder="https://..."
                           th:value="${poi.coverImg != null ? poi.coverImg : ''}">
                </div>

                <div class="col-12">
                    <label class="form-label">简介</label>
                    <textarea name="intro" class="form-control" rows="3" th:text="${poi.intro != null ? poi.intro : ''}"></textarea>
                </div>

                <div class="col-md-4">
                    <label class="form-label">状态</label>
                    <select name="status" class="form-select">
                        <option value="1" th:selected="${poi.status == 1}">上架</option>
                        <option value="0" th:selected="${poi.status == 0}">下架</option>
                    </select>
                </div>

                <div class="col-12 mt-4">
                    <button class="btn btn-primary">保存修改</button>
                    <a href="/admin" class="btn btn-outline-secondary">取消</a>
                </div>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
