<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员登录 · 校园生活圈</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px;">
            <span class="brand"><span class="mark">🔐</span></span>
            <span style="font-size:12.5px;color:var(--ink-3);">管理员后台</span>
        </div>
        <h1>后台登录</h1>
        <p class="auth-sub">用管理员账号进入，可增删改地点、管理评论</p>

        <div th:replace="~{partials/flash}"></div>

        <form action="/admin/login" method="POST">
            <div class="field">
                <label>管理员账号</label>
                <input type="text" name="username" placeholder="admin" required autofocus>
            </div>
            <div class="field">
                <label>密码</label>
                <input type="password" name="pwd" placeholder="输入管理员密码" required>
            </div>
            <button class="btn-app" style="width:100%;margin-top:6px;padding:11px;background:#10231f;">进入后台</button>
        </form>

        <p class="auth-foot"><a href="/">← 返回前台首页</a></p>
    </div>
</div>
</body>
</html>
