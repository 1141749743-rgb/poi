<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 · 校园生活圈</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px;">
            <span class="brand"><span class="mark">📍</span></span>
            <span style="font-size:12.5px;color:var(--ink-3);">广二师 · 花都校区</span>
        </div>
        <h1>欢迎回来</h1>
        <p class="auth-sub">登录后可以收藏地点、发表评论，并获得个性化推荐</p>

        <div th:replace="~{partials/flash}"></div>

        <form action="/login" method="POST">
            <div class="field">
                <label>用户名</label>
                <input type="text" name="username" placeholder="输入你的用户名" required autofocus>
            </div>
            <div class="field">
                <label>密码</label>
                <input type="password" name="pwd" placeholder="输入密码" required>
            </div>
            <button class="btn-app" style="width:100%;margin-top:6px;padding:11px;">登录</button>
        </form>

        <p class="auth-foot">还没有账号？<a href="/register">去注册</a> · <a href="/">返回首页</a></p>
    </div>
</div>
</body>
</html>
